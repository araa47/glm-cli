[project]
name = "glm_cli"
version = "0.1.1"
description = "Genelec GLM API (works over virtual midi, expects app to be open)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "mido>=1.3.2",
    "python-rtmidi>=1.5.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.3",
    "pytest",
    "pytest-asyncio<0.23",
    "pytest-cov",
    "prek>=0.3.5",
]


[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]
line_length = 80
include_trailing_comma = true
multi_line_output = 3

[tool.ruff]
select = ["E", "F", "B"]
exclude = ["__pycache__", "terraform", ".git", ".venv"]
ignore = ["E501"]

[project.scripts]
glm-cli = "glm_cli:cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
